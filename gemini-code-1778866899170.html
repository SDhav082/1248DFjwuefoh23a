<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ID Barcode Scanner Max</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root { --blue: #007bff; --dark: #121212; --card: #1e1e1e; --text: #eeeeee; }
        body { font-family: -apple-system, sans-serif; background: var(--dark); color: var(--text); margin: 0; padding: 15px; }
        .container { max-width: 500px; margin: auto; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid #333 !important; }
        .info-box { background: #2c2c2c; padding: 15px; border-radius: 8px; margin: 15px 0; font-size: 0.9rem; border-left: 4px solid var(--blue); }
        #result-card { display: none; background: var(--card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        .data-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #333; }
        .label { color: #888; font-size: 0.75rem; text-transform: uppercase; }
        .val { font-weight: bold; }
        button { background: var(--blue); color: white; border: none; padding: 15px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; margin-top: 10px; }
        #reader__dashboard_section_csr button { padding: 8px 12px !important; margin: 5px !important; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="text-align:center; color:var(--blue)">ID PDF417 Scanner</h2>
    
    <div id="reader"></div>

    <div class="info-box" id="instruction">
        <b>Tip:</b> If it's not catching, pull your phone back to about 8 inches and hold it <b>Landscape (Horizontal)</b>.
    </div>

    <div id="result-card">
        <h3 style="margin-top:0">Scan Successful</h3>
        <div id="data-output"></div>
        <button onclick="location.reload()">Reset Scanner</button>
    </div>
</div>

<script>
    const FIELD_MAP = {
        "DCS": "Last Name", "DAC": "First Name", "DAD": "Middle Name",
        "DBB": "DOB", "DAG": "Address", "DAI": "City", "DAJ": "State",
        "DAK": "Zip", "DAQ": "ID Number"
    };

    function parseID(raw) {
        let html = "";
        // Look for the AAMVA start
        const offset = raw.indexOf("ANSI ");
        const data = offset !== -1 ? raw.substring(offset) : raw;

        Object.keys(FIELD_MAP).forEach(key => {
            const match = data.match(new RegExp(key + "([^\\n\\r\\f]+)"));
            if (match) {
                html += `<div class="data-row"><span class="label">${FIELD_MAP[key]}</span><span class="val">${match[1].trim()}</span></div>`;
            }
        });
        return html;
    }

    const scanner = new Html5Qrcode("reader", { 
        // We tell the engine to specifically prioritize PDF417
        verbose: false,
        formatsToSupport: [ Html5QrcodeSupportedFormats.PDF_417 ]
    });

    const config = { 
        fps: 20, 
        qrbox: (viewfinderWidth, viewfinderHeight) => {
            return { width: viewfinderWidth * 0.9, height: viewfinderHeight * 0.5 };
        },
        aspectRatio: 1.777
    };

    scanner.start(
        { facingMode: "environment" }, 
        config,
        (text) => {
            scanner.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                document.getElementById('instruction').style.display = 'none';
                const output = parseID(text);
                document.getElementById('data-output').innerHTML = output || `<b>Raw Data:</b><br><small>${text}</small>`;
                document.getElementById('result-card').style.display = 'block';
            });
        }
    ).catch(err => {
        document.getElementById('instruction').innerHTML = `<span style="color:red">Error: ${err}</span>`;
    });
</script>

</body>
</html>
