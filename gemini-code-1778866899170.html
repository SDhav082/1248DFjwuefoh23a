<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Scanner</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: sans-serif; background: #0f172a; color: white; text-align: center; margin: 0; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 10px; overflow: hidden; background: #000; }
        .result-card { display: none; background: #1e293b; padding: 20px; border-radius: 15px; margin-top: 20px; text-align: left; }
        .row { display: flex; justify-content: space-between; border-bottom: 1px solid #334155; padding: 8px 0; }
        .label { color: #94a3b8; font-size: 12px; text-transform: uppercase; }
        button { background: #2563eb; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-weight: bold; margin-top: 20px; width: 100%; }
        #status { color: #38bdf8; margin-bottom: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <h2>ID Barcode Scanner</h2>
    <div id="status">Initializing Camera...</div>
    
    <div id="reader"></div>

    <div id="result-card" class="result-card">
        <h3>ID Details</h3>
        <div id="parsedData"></div>
        <button onclick="location.reload()">Scan Again</button>
    </div>

<script>
    const ID_KEYS = {
        "DCS": "Last Name", "DAC": "First Name", "DAD": "Middle Name",
        "DBB": "Date of Birth", "DAG": "Address", "DAI": "City",
        "DAJ": "State", "DAK": "Zip Code", "DAQ": "ID Number"
    };

    function parseID(rawText) {
        let results = "";
        const cleanText = rawText.substring(Math.max(0, rawText.indexOf("ANSI")));
        Object.keys(ID_KEYS).forEach(key => {
            const regex = new RegExp(key + "([^\\n\\r\\f]+)");
            const match = cleanText.match(regex);
            if (match && match[1]) {
                results += `<div class="row"><span class="label">${ID_KEYS[key]}</span><span>${match[1].trim()}</span></div>`;
            }
        });
        return results;
    }

    // Basic, high-compatibility initialization
    const html5QrCode = new Html5Qrcode("reader");
    
    const qrConfig = { 
        fps: 10, 
        qrbox: { width: 300, height: 150 },
        // This is the most important part for you:
        formatsToSupport: [ Html5QrcodeSupportedFormats.PDF_417 ]
    };

    html5QrCode.start(
        { facingMode: "environment" }, 
        qrConfig,
        (decodedText) => {
            html5QrCode.stop().then(() => {
                document.getElementById('reader').style.display = 'none';
                document.getElementById('status').style.display = 'none';
                const display = document.getElementById('parsedData');
                display.innerHTML = parseID(decodedText) || `<b>Raw Data:</b><br>${decodedText}`;
                document.getElementById('result-card').style.display = 'block';
            });
        }
    ).then(() => {
        document.getElementById('status').innerText = "Ready! Center the wide barcode.";
    }).catch(err => {
        document.getElementById('status').innerText = "Error: Camera blocked or not found.";
        console.error(err);
    });
</script>
</body>
</html>
