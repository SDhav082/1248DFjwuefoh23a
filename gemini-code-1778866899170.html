<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ID Scanner Pro</title>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --primary: #38bdf8;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body { 
            font-family: -apple-system, system-ui, sans-serif; 
            background-color: var(--bg);
            margin: 0; padding: 15px; color: var(--text);
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 500px; }
        h1 { text-align: center; font-size: 1.5rem; margin-bottom: 10px; color: var(--primary); }
        
        #reader {
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid #334155 !important;
            background: #000;
        }
        
        #result-card {
            margin-top: 20px;
            padding: 20px;
            background: var(--card);
            border-radius: 12px;
            display: none;
            box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.5);
            width: 100%;
            box-sizing: border-box;
        }

        .data-row {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #334155;
        }
        .label { font-weight: 600; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
        .value { font-weight: 500; color: #f8fafc; text-align: right; margin-left: 10px; }
        
        .btn {
            display: block; width: 100%; padding: 16px;
            background: #2563eb; color: white;
            border: none; border-radius: 12px; font-weight: 600;
            margin-top: 20px; cursor: pointer; font-size: 1rem;
        }
        .hint {
            text-align: center; font-size: 0.9rem; color: #94a3b8; margin: 15px 0;
            line-height: 1.4;
        }
        #reader__dashboard_section_csr button {
            background: var(--primary) !important;
            color: var(--bg) !important;
            padding: 10px 20px !important;
            border-radius: 8px !important;
            text-transform: uppercase !important;
            font-weight: bold !important;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>ID Barcode Scanner</h1>
    <p class="hint">Center the large pixelated barcode in the box.<br><b>Ignore the thin line barcodes.</b></p>
    
    <div id="reader"></div>

    <div id="result-card">
        <h2 style="margin-top:0; color: var(--primary); border-bottom: 2px solid #334155; padding-bottom: 10px;">ID Details</h2>
        <div id="parsedData"></div>
        <button class="btn" onclick="location.reload()">Scan Next ID</button>
    </div>
</div>
