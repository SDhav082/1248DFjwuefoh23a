<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>High-Res ID Scanner</title>
    <script src="https://unpkg.com/@zxing/library@latest"></script>
    <style>
        :root { --blue: #00d2ff; --bg: #0a0e14; }
        body { font-family: sans-serif; background: var(--bg); color: white; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; overflow-x: hidden; }
        .header { padding: 20px; text-align: center; width: 100%; }
        #video-container { position: relative; width: 90%; max-width: 450px; aspect-ratio: 4/3; border: 2px solid #333; border-radius: 20px; overflow: hidden; background: #000; }
        #video { width: 100%; height: 100%; object-fit: cover; }
        
        /* The Scanning Box Overlay */
        .overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 40%; border: 2px solid var(--blue); border-radius: 10px; box-shadow: 0 0 0 1000px rgba(0,0,0,0.5); pointer-events: none; }
        .overlay::after { content: "ALIGN PDF417 BARCODE HERE"; position: absolute; bottom: -25px; left: 0; width: 100%; text-align: center; font-size: 10px; color: var(--blue); letter-spacing: 1px; }

        .controls { width: 90%; max-width: 450px; margin-top: 20px; }
        .zoom-slider { width: 100%; margin: 10px 0; accent-color: var(--blue); }
        
        #result-card { display: none; width: 90%; max-width: 450px; background: #1a1f26; padding: 20px; border-radius: 15px; margin-top: 20px; box-sizing: border-box; }
        .row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #2d353f; }
        .label { color: #88929b; font-size: 11px; text-transform: uppercase; }
        .val { font-weight: bold; font-size: 14px; }
        button { background: #2563eb; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; font-weight: bold; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="margin:0; color:var(--blue)">ID Scanner</h2>
        <p style="font-size:12px; color:#888">Landscape mode works best</p>
    </div>

    <div id="video-container">
        <video id="video"></video>
        <div class="overlay"></div>
    </div>

    <div class="controls">
        <label style="font-size: 12px; color: #888;">Digital Zoom</label>
        <input type="range" class="zoom-slider" id="zoom" min="1" max="3" step="0.1" value="1">
    </div>

    <div id="result-card">
        <h3 style="margin-top:0; color:var(--blue)">Identity Details</h3>
        <div id="data-output"></div>
        <button onclick="location.reload()">New Scan</button>
    </div>

<script>
    const codeReader = new ZXing.BrowserPDF417Reader();
    const video = document.getElementById('video');
    const zoomSlider = document.getElementById('zoom');
    let selectedDeviceId;

    // AAMVA Field Map
    const FIELDS = {"DCS":"Last Name","DAC":"First Name","DBB":"Date of Birth","DAG":"Address","DAI":"City","DAJ":"State","DAK":"Zip","DAQ":"ID #"};

    // Zoom Logic
    zoomSlider.addEventListener('input', (e) => {
        const val = e.target.value;
        video.style.transform = `scale(${val})`;
    });

    function parse(raw) {
        let html = "";
        const data = raw.substring(Math.max(0, raw.indexOf("ANSI ")));
        Object.keys(FIELDS).forEach(key => {
            const m = data.match(new RegExp(key + "([^\\n\\r\\f]+)"));
            if(m) html += `<div class="row"><span class="label">${FIELDS[key]}</span><span class="val">${m[1].trim()}</span></div>`;
        });
        return html;
    }

    async function init() {
        const devices = await codeReader.listVideoInputDevices();
        selectedDeviceId = devices[devices.length - 1].deviceId; // Usually the back camera

        codeReader.decodeFromVideoDevice(selectedDeviceId, 'video', (result, err) => {
            if (result) {
                console.log(result.text);
                document.getElementById('video-container').style.display = 'none';
                document.querySelector('.controls').style.display = 'none';
                document.getElementById('data-output').innerHTML = parse(result.text) || `<b>Raw:</b> ${result.text}`;
                document.getElementById('result-card').style.display = 'block';
            }
        });
    }

    init().catch(err => alert("Camera Error: Ensure HTTPS is used."));
</script>
</body>
</html>
